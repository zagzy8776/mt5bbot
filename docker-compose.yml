services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: mt5-platform-db
    environment:
      POSTGRES_USER: mt5
      POSTGRES_PASSWORD: mt5
      POSTGRES_DB: mt5_platform
    ports:
      - "5432:5432"
    volumes:
      - mt5_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mt5 -d mt5_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mt5-platform-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mt5_pg_data:
